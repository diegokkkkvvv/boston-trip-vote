<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1730">
<title>Boston Trip Vote · Oct 25 – Nov 9</title>
<style>
:root{
  --navy:#0a1730; --navy2:#0d1f3d; --card:#132442; --line:#2a3f66;
  --gold:#d4af37; --blue:#4da3ff; --txt:#f2f5fa; --mut:#9fb0cc;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--navy);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;}
header{position:sticky;top:0;z-index:20;background:var(--navy2);
  border-bottom:1px solid var(--line);padding:10px 14px;}
header h1{margin:0;font-size:18px;letter-spacing:.3px;}
header h1 .amp{color:var(--gold);}
header p{margin:2px 0 0;font-size:12.5px;color:var(--mut);}
.idrow{display:flex;gap:8px;margin-top:10px;align-items:center;}
.idrow span.lbl{font-size:12.5px;color:var(--mut);}
.idbtn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:999px;padding:9px 0;font-size:14.5px;font-weight:600;cursor:pointer;}
.idbtn.on-diego{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;}
.idbtn.on-jd{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.idbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;}
#daybar{position:sticky;top:0;z-index:19;background:var(--navy);border-bottom:1px solid var(--line);}
#daychips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;}
#daychips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;min-width:66px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);border-radius:12px;padding:7px 6px;font-size:12px;text-align:center;cursor:pointer;}
.chip b{display:block;font-size:13.5px;}
.chip .st{display:block;height:8px;margin-top:4px;}
.chip .st i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 2px;background:#3a4f78;}
.chip .st i.one{background:var(--blue);}
.chip .st i.two{background:var(--blue);}
.chip .st i.lock{background:var(--gold);}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
main{max-width:660px;margin:0 auto;padding:6px 12px 120px;}
.dayhead{margin:14px 2px 4px;}
.dayhead h2{margin:0;font-size:21px;}
.dayhead p{margin:2px 0 0;color:var(--mut);font-size:13.5px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 13px 11px;margin:12px 0;}
.card h3{margin:0 0 2px;font-size:15.5px;}
.card h3 .gold{color:var(--gold);}
.card .sub{font-size:12.5px;color:var(--mut);margin:0 0 6px;}
.opt{position:relative;display:block;width:100%;text-align:left;background:#0f2038;
  border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:10px 12px;margin:8px 0;cursor:pointer;font-size:14.5px;}
.opt .nm{font-weight:600;}
.opt .bl{font-size:12.5px;color:var(--mut);margin-top:2px;}
.opt .go{font-size:12.5px;color:var(--blue);margin-top:4px;display:inline-block;}
.opt .rank{position:absolute;top:8px;right:10px;min-width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#1a1206;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;}
.opt.picked{border-color:var(--gold);}
.votes{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.vtag{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--mut);}
.vtag.d{border-color:var(--blue);color:var(--blue);}
.vtag.j{border-color:var(--gold);color:var(--gold);}
.locked{border:1px dashed var(--gold);border-radius:11px;padding:10px 12px;margin:8px 0;background:#171208;}
.locked .nm{font-weight:700;color:var(--gold);}
.locked .bl{font-size:12.5px;color:var(--mut);}
.locked a{color:var(--blue);font-size:13px;}
.notice{background:#101f3a;border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:13.5px;color:var(--mut);margin:12px 0;}
.notice b{color:var(--txt);}
select, .txtin{width:100%;background:#0f2038;color:var(--txt);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:14.5px;margin-top:8px;}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;
  font-size:15.5px;font-weight:700;cursor:pointer;margin:10px 0;}
.btn-gold{background:var(--gold);color:#1a1206;}
.btn-blue{background:var(--blue);color:#06121f;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
table.res th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;
  text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);}
table.res td{padding:7px 4px;border-bottom:1px solid #1c2f52;vertical-align:top;}
table.res tr.win td{background:#1a1408;}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;
  padding:2px 8px;margin-left:6px;vertical-align:1px;}
.badge.match{background:var(--gold);color:#1a1206;}
.badge.agree{background:#274b7a;color:#cfe3ff;}
.winnerline{font-size:14.5px;margin:8px 0 2px;}
.winnerline b{color:var(--gold);}
#sharebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy2);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
#sharebar .row{max-width:660px;margin:0 auto;display:flex;gap:8px;}
#sharebar .btn{margin:0;}
#modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.78);display:none;
  align-items:flex-end;justify-content:center;}
#modal.open{display:flex;}
.sheet{background:var(--navy2);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;max-width:660px;width:100%;padding:18px 16px 26px;}
.sheet h3{margin:0 0 8px;}
.sheet p{font-size:13.5px;color:var(--mut);}
.linkbox{background:#0a1428;border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:12px;word-break:break-all;color:var(--blue);max-height:110px;overflow:auto;}
.howto{background:var(--card);border:1px solid var(--gold);border-radius:14px;
  padding:13px;margin:12px 0;font-size:13.5px;}
.howto b{color:var(--gold);}
.howto ol{margin:8px 0 4px;padding-left:20px;}
.howto li{margin:4px 0;}
.howto .x{float:right;background:none;border:none;color:var(--mut);font-size:16px;cursor:pointer;}
.extbtn{display:inline-block;background:#1b3a6b;color:#fff;border-radius:9px;
  padding:8px 12px;font-size:13px;text-decoration:none;margin:6px 6px 0 0;}
a{color:var(--blue);}
</style>
</head>
<body>
<header>
  <h1>Boston Trip Vote <span class="amp">·</span> <span style="font-weight:400;font-size:14px;">Oct 25 – Nov 9</span></h1>
  <p>Diego &amp; Juan Diego · rank your top 3 in each category · most points wins</p>
  <div class="idrow">
    <span class="lbl">Voting as:</span>
    <button class="idbtn" id="btnDiego"><span class="dot" style="background:#4da3ff"></span>Diego</button>
    <button class="idbtn" id="btnJD"><span class="dot" style="background:#d4af37"></span>Juan Diego</button>
  </div>
</header>
<div id="daybar"><div id="daychips"></div></div>
<main id="main"></main>
<div id="sharebar"><div class="row">
  <button class="btn btn-ghost" id="btnHow" style="flex:0 0 44px;">?</button>
  <button class="btn btn-gold" id="btnShare">Share our votes</button>
</div></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
/* ================= DATA ================= */
const DAYS=[
 {id:"d25",d:"Sun Oct 25",label:"Arrival day"},
 {id:"d26",d:"Mon Oct 26",label:"Freedom Trail day"},
 {id:"d27",d:"Tue Oct 27",label:"North End + Celtics"},
 {id:"d28",d:"Wed Oct 28",label:"Museum day"},
 {id:"d29",d:"Thu Oct 29",label:"Back Bay + Gardner"},
 {id:"d30",d:"Fri Oct 30",label:"Waterfront + RAWAYANA"},
 {id:"d31",d:"Sat Oct 31",label:"Halloween in Salem"},
 {id:"d01",d:"Sun Nov 1",label:"Slow Sunday"},
 {id:"d02",d:"Mon Nov 2",label:"Bruins night"},
 {id:"d03",d:"Tue Nov 3",label:"Tea Party day"},
 {id:"d04",d:"Wed Nov 4",label:"WICKED night"},
 {id:"d05",d:"Thu Nov 5",label:"Aquarium day"},
 {id:"d06",d:"Fri Nov 6",label:"Fenway + date night"},
 {id:"d07",d:"Sat Nov 7",label:"Comedy night"},
 {id:"d08",d:"Sun Nov 8",label:"Last full day"},
 {id:"d09",d:"Mon Nov 9",label:"Departure"}
];
const ORDER=DAYS.map(x=>x.id);
const PLACES=[
 {id:"freedom",n:"Freedom Trail",b:"2.5-mile walk through 16 historic sites",u:"https://www.thefreedomtrail.org/"},
 {id:"common",n:"Boston Common & Public Garden",b:"Swan boats, fall colors, people-watching",u:""},
 {id:"beacon",n:"Beacon Hill & Acorn Street",b:"Cobblestones, gas lamps, Boston's prettiest street",u:""},
 {id:"northend",n:"North End",b:"Little Italy: cannoli, espresso, Hanover Street",u:""},
 {id:"harvard",n:"Harvard Yard & Square",b:"Diego's backyard: historic yard, bookshops",u:"https://www.harvard.edu/"},
 {id:"mit",n:"MIT & Kendall Square",b:"Stata Center, tech-campus vibes",u:"https://www.mit.edu/"},
 {id:"newbury",n:"Newbury Street & Back Bay",b:"Shopping, brownstones, Boston Public Library",u:"https://www.bpl.org/"},
 {id:"quincy",n:"Quincy Market & Faneuil Hall",b:"Food stalls and street performers",u:"https://www.faneuilhallmarketplace.com/"},
 {id:"waterfront",n:"Harborwalk & Waterfront",b:"Ferries, skyline views, sea air",u:""},
 {id:"esplanade",n:"Charles River Esplanade",b:"Sunset walks with skyline views",u:"https://esplanade.org/"},
 {id:"southend",n:"South End",b:"Galleries, brunch spots, brownstones",u:""},
 {id:"cambridge",n:"Central & Inman Squares",b:"Dive bars and local Cambridge flavor",u:""},
 {id:"mfa",n:"Museum of Fine Arts",b:"World-class art, about $30",u:"https://www.mfa.org/"},
 {id:"gardner",n:"Gardner Museum",b:"Venetian courtyard palace, about $25 (free Thu evenings)",u:"https://www.gardnermuseum.org/"},
 {id:"aquarium",n:"New England Aquarium",b:"Penguins and a giant ocean tank",u:"https://www.neaq.org/"},
 {id:"teaparty",n:"Tea Party Ships & Museum",b:"Throw tea in the harbor, about $35",u:"https://www.bostonteapartyship.com/"},
 {id:"fenway",n:"Fenway Park Tour",b:"Green Monster, about $25",u:"https://www.mlb.com/red-sox/ballpark/tours"},
 {id:"salem",n:"Salem day trip",b:"Witch-trial history and waterfront",u:"https://www.salem.org/"}
];
const FOODS=[
 {id:"diego-cooks",n:"Diego cooks for Juan Diego",b:"Show off your skills, chef"},
 {id:"jd-cooks",n:"Juan Diego cooks for Diego",b:"Your turn in the kitchen"},
 {id:"eat-out",n:"We go out to eat",b:"Pick a cuisine below if this wins"}
];
const CUISINES=["Seafood boil","Italian","Mexican","Chinese","Japanese / Sushi","Indian","Thai","Pizza","American BBQ","Brunch spot","Wings & beer"];
const NIGHTPOOL={
 viewboston:{n:"View Boston observation deck",b:"360° views from the Prudential",u:"https://viewboston.com/"},
 improv:{n:"Improv Asylum (North End)",b:"Live improv comedy",u:"https://improvasylum.com/"},
 laugh:{n:"Laugh Boston (Seaport)",b:"Stand-up comedy club",u:"https://laughboston.com/"},
 coolidge:{n:"Coolidge Corner Theatre",b:"Classic indie cinema in Brookline",u:"https://coolidge.org/"},
 wallys:{n:"Wally's Cafe",b:"Legendary tiny live-jazz club",u:"https://wallyscafe.com/"},
 samadams:{n:"Sam Adams Brewery",b:"Tour and tasting in Jamaica Plain",u:"https://www.samueladams.com/"},
 esplanade_walk:{n:"Sunset walk on the Esplanade",b:"Free and romantic",u:""},
 trivia:{n:"Trivia night",b:"Bar trivia, big-brain energy",u:""},
 harvard_drinks:{n:"Drinks in Harvard Square",b:"Bars near home",u:""},
 early_in:{n:"Early night in",b:"Rest up, arrival mode",u:""}
};
const NIGHTS={
 d25:["esplanade_walk","harvard_drinks","early_in"],
 d26:["viewboston","improv","wallys"],
 d28:["laugh","coolidge","trivia"],
 d01:["wallys","esplanade_walk","coolidge"],
 d03:["viewboston","improv","samadams"],
 d08:["laugh","esplanade_walk","trivia"]
};
const CLUBS=[
 {id:"bijou",n:"Bijou",b:"Theater District mega-club"},
 {id:"grand",n:"The Grand",b:"Big-room club, downtown"},
 {id:"royale",n:"Royale",b:"Concert-sized club nights"},
 {id:"club51",n:"51",b:"Your call, Diego"},
 {id:"latin",n:"Latin party hunt",b:"Find tonight's Latin party in the live listings below"},
 {id:"bars",n:"Bar night instead",b:"Cocktail bars, no cover"},
 {id:"rest",n:"Rest night",b:"Recharge for tomorrow"}
];
const LATIN_LINKS=[
 {n:"Eventbrite: Latin parties in Boston",u:"https://www.eventbrite.com/d/ma--boston/latin-party/"},
 {n:"Dice: Boston events",u:"https://dice.fm/"}
];
const VIBES=[
 {id:"chill",n:"Chill",b:"Slow morning, no rush"},
 {id:"adventure",n:"Adventure",b:"Pack the day full"},
 {id:"romantic",n:"Romantic",b:"Date-mode on"},
 {id:"culture",n:"Culture deep-dive",b:"Museums and history"},
 {id:"foodie",n:"Foodie",b:"Eat our way through the day"}
];
const DESSERTS=[
 {id:"mikes",n:"Mike's Pastry",b:"The famous tourist pick"},
 {id:"modern",n:"Modern Pastry",b:"The locals' pick"},
 {id:"bovas",n:"Bova's Bakery",b:"Open 24 hours, underdog"}
];
const LOCKED={
 d27:{n:"Celtics vs Nets · 7:30 PM",b:"TD Garden — tickets already sorted",u:"https://www.ticketmaster.com/boston-celtics-vs-brooklyn-nets-boston-massachusetts-10-27-2026/event/0100650C9466940C"},
 d30:{n:"RAWAYANA · 8 PM",b:"MGM Music Hall — tickets already sorted",u:"",after:"after"},
 d02:{n:"Bruins vs Golden Knights · 7 PM",b:"TD Garden — tickets already sorted",u:"https://www.ticketmaster.com/boston-bruins-vs-vegas-golden-knights-boston-massachusetts-11-02-2026/event/010064EDC5097A28"},
 d04:{n:"WICKED · 7 PM",b:"Citizens Opera House — tickets via Broadway In Boston",u:""},
 d07:{n:"Comics Come Home · 8 PM",b:"TD Garden — tickets already sorted",u:"",after:"after"}
};
const CATS=[
 {id:"places",t:"Places to visit"},
 {id:"food",t:"Food"},
 {id:"tonight",t:"Tonight"},
 {id:"vibe",t:"Vibe of the day"},
 {id:"dessert",t:"Sweet tooth showdown"}
];
const VOTERS={diego:{n:"Diego",c:"#4da3ff"},juandiego:{n:"Juan Diego",c:"#d4af37"}};
/* ================= STATE ================= */
function blankState(){return {me:"diego",votes:{diego:{},juandiego:{}},cuisine:{},decided:{}};}
let S=blankState();
let curDay="d25", showResults=false, loadedShared=false;
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function dec(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem("btv1",enc(S));}catch(e){}}
function syncHash(){try{history.replaceState(null,"","#s="+enc(S));}catch(e){} saveLocal();}
function loadState(){
  let h="";
  if(location.hash.indexOf("#s=")===0){h=location.hash.slice(3);}
  if(h){const d=dec(h); if(d&&d.votes){S=Object.assign(blankState(),d); loadedShared=true; return;}}
  try{const l=localStorage.getItem("btv1"); if(l){const d=dec(l); if(d&&d.votes)S=Object.assign(blankState(),d);}}catch(e){}
}
/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function dayVotes(voter,dayId,cat){const d=S.votes[voter]&&S.votes[voter][dayId];return (d&&d[cat])||[];}
function myVotes(dayId,cat){return dayVotes(S.me,dayId,cat);}
function rankOf(voter,dayId,cat,optId){const a=dayVotes(voter,dayId,cat);const i=a.indexOf(optId);return i>=0?i+1:0;}
function decidedBefore(dayId){
  const idx=ORDER.indexOf(dayId),out=new Set();
  ORDER.slice(0,idx).forEach(did=>{const w=S.decided[did];if(w&&w.places)out.add(w.places);});
  return out;
}
function placesFor(dayId){const gone=decidedBefore(dayId);return PLACES.filter(p=>!gone.has(p.id));}
function isClubNight(dayId){return ["d29","d31","d05","d06"].indexOf(dayId)>=0;}
function tonightKind(dayId){
  if(dayId==="d09")return "none";
  const L=LOCKED[dayId];
  if(L)return L.after?"locked_after":"locked";
  if(NIGHTS[dayId])return "nightopts";
  if(isClubNight(dayId))return "clubs";
  return "none";
}
function clubOpts(){return CLUBS;}
function nightOpts(dayId){return NIGHTS[dayId].map(id=>Object.assign({id},NIGHTPOOL[id]));}
/* ================= RENDER ================= */
function renderIdentity(){
  $("btnDiego").className="idbtn"+(S.me==="diego"?" on-diego":"");
  $("btnJD").className="idbtn"+(S.me==="juandiego"?" on-jd":"");
}
function dayStatus(dayId){
  if(S.decided[dayId]&&Object.keys(S.decided[dayId]).length)return "lock";
  const a=dayVotes("diego",dayId),b=dayVotes("juandiego",dayId);
  const ha=a&&Object.keys(a).length, hb=b&&Object.keys(b).length;
  if(ha&&hb)return "two"; if(ha||hb)return "one"; return "";
}
function renderChips(){
  $("daychips").innerHTML=DAYS.map(d=>{
    const st=dayStatus(d.id);
    const dot=st==="lock"?'<i class="lock"></i>':st==="two"?'<i class="two"></i><i class="two"></i>':st==="one"?'<i class="one"></i>':"<i></i>";
    const parts=d.d.split(" ");
    return `<button class="chip${d.id===curDay?" on":""}" data-day="${d.id}"><b>${parts[0]}</b>${parts[1]} ${parts[2]}<span class="st">${dot}</span></button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{curDay=c.dataset.day;showResults=false;syncHash();renderAll();});
}
function optHTML(dayId,cat,o){
  const mine=myVotes(dayId,cat),ri=mine.indexOf(o.id);
  const r1=rankOf("diego",dayId,cat,o.id),r2=rankOf("juandiego",dayId,cat,o.id);
  let tags="";
  if(r1)tags+=`<span class="vtag d">Diego #${r1}</span>`;
  if(r2)tags+=`<span class="vtag j">Juan Diego #${r2}</span>`;
  const link=o.u?`<a class="go" href="${esc(o.u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open link</a>`:"";
  return `<button class="opt${ri>=0?" picked":""}" data-cat="${cat}" data-opt="${esc(o.id)}">
    ${ri>=0?`<span class="rank">${ri+1}</span>`:""}
    <span class="nm">${esc(o.n)}</span>
    ${o.b?`<div class="bl">${esc(o.b)}</div>`:""}
    ${link}${tags?`<div class="votes">${tags}</div>`:""}
  </button>`;
}
function lockedBanner(L){
  return `<div class="locked"><div class="nm">${esc(L.n)}</div><div class="bl">${esc(L.b)}</div>
  ${L.u?`<a href="${esc(L.u)}" target="_blank" rel="noopener">Get tickets</a>`:""}</div>`;
}
function latinCard(){
  return `<div class="notice"><b>Tonight's Latin parties — live listings.</b><br>These pages always show what's actually on:<br>
  ${LATIN_LINKS.map(l=>`<a class="extbtn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.n)}</a>`).join("")}</div>`;
}
function foodCard(dayId){
  const dec=S.decided[dayId]&&S.decided[dayId].food;
  let h=`<div class="card"><h3>Food</h3><p class="sub">Rank your top 3. Tap again to remove.</p>`;
  if(dec){const o=FOODS.find(f=>f.id===dec);h+=`<div class="locked"><div class="nm">${esc(o.n)}</div><div class="bl">Decided</div></div>`;}
  else h+=FOODS.map(o=>optHTML(dayId,"food",o)).join("");
  const cur=S.cuisine[dayId]||"";
  h+=`<p class="sub" style="margin-top:10px">If "We go out to eat" wins — cuisine:</p>
    <select id="cuisineSel"><option value="">Pick a cuisine…</option>
    ${CUISINES.map(c=>`<option${c===cur?" selected":""}>${c}</option>`).join("")}</select></div>`;
  return h;
}
function tonightCard(dayId){
  const kind=tonightKind(dayId);
  if(kind==="none")return "";
  const dec=S.decided[dayId]&&S.decided[dayId].tonight;
  let h=`<div class="card"><h3>Tonight</h3>`;
  if(kind==="locked"){h+=`<p class="sub">Already sorted — no vote needed.</p>`+lockedBanner(LOCKED[dayId]);}
  else{
    if(kind==="locked_after")h+=lockedBanner(LOCKED[dayId])+`<p class="sub"><b>After the show</b> — rank your top 3:</p>`;
    else if(kind==="clubs")h+=`<p class="sub">Clubbing night — rank your top 3. ${dayId==="d31"?"<b>Halloween: buy tickets in advance, expect lines.</b>":""}</p>`;
    else h+=`<p class="sub">Rank your top 3. Tap again to remove.</p>`;
    if(dec){
      const pool=kind==="clubs"?clubOpts():(kind==="nightopts"?nightOpts(dayId):clubOpts());
      const o=pool.find(x=>x.id===dec);
      h+=`<div class="locked"><div class="nm">${esc(o?o.n:dec)}</div><div class="bl">Decided</div></div>`;
    }else{
      const pool=kind==="clubs"?clubOpts():nightOpts(dayId);
      h+=pool.map(o=>optHTML(dayId,"tonight",o)).join("");
    }
    if(kind==="clubs"||kind==="locked_after")h+=latinCard();
  }
  return h+`</div>`;
}
function catCard(dayId,cat,title,sub,opts,decId){
  let h=`<div class="card"><h3>${title}</h3><p class="sub">${sub}</p>`;
  if(decId){
    const o=opts.find(x=>x.id===decId);
    h+=`<div class="locked"><div class="nm">${esc(o?o.n:decId)}</div><div class="bl">Decided</div></div>`;
  }else h+=opts.map(o=>optHTML(dayId,cat,o)).join("");
  return h+`</div>`;
}
function renderDay(){
  const d=DAYS.find(x=>x.id===curDay);
  let h=`<div class="dayhead"><h2>${d.d}</h2><p>${esc(d.label)}</p></div>`;
  if(loadedShared){h+=`<div class="notice"><b>Votes loaded from the shared link.</b> Pick who you are up top, add your rankings, then share the link back so you stay in sync.</div>`;loadedShared=false;}
  const dec=S.decided[curDay]||{};
  h+=catCard(curDay,"places","Places to visit","Rank your top 3. Picked places leave the pool for later days.",placesFor(curDay),dec.places);
  h+=foodCard(curDay);
  h+=tonightCard(curDay);
  if(curDay!=="d09"){
    h+=catCard(curDay,"vibe","Vibe of the day","Rank your top 3.",VIBES,dec.vibe);
    h+=catCard(curDay,"dessert","Sweet tooth showdown","The North End cannoli debate — rank your top 3.",DESSERTS,dec.dessert);
  }
  const votable=tonightKind(curDay)!=="locked"&&tonightKind(curDay)!=="none";
  h+=`<button class="btn btn-blue" id="btnRes">${showResults?"Hide results":"See results"}</button><div id="resbox"></div>`;
  $("main").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>vote(curDay,b.dataset.cat,b.dataset.opt));
  const cs=$("cuisineSel"); if(cs)cs.onchange=()=>{S.cuisine[curDay]=cs.value;syncHash();};
  $("btnRes").onclick=()=>{showResults=!showResults;renderDay();if(showResults)renderResults();};
  if(showResults)renderResults();
}
function vote(dayId,cat,optId){
  if(!S.votes[S.me][dayId])S.votes[S.me][dayId]={};
  const arr=S.votes[S.me][dayId][cat]||(S.votes[S.me][dayId][cat]=[]);
  const i=arr.indexOf(optId);
  if(i>=0)arr.splice(i,1); else if(arr.length<3)arr.push(optId);
  syncHash();renderAll();
}
function scoreRows(dayId,cat,opts){
  return opts.map(o=>{
    const r1=rankOf("diego",dayId,cat,o.id),r2=rankOf("juandiego",dayId,cat,o.id);
    const p=r=>r?4-r:0;
    return {o,r1,r2,total:p(r1)+p(r2)};
  }).sort((a,b)=>b.total-a.total||(a.r1||9)-(b.r1||9));
}
function renderResults(){
  const box=$("resbox");if(!box)return;
  const dec=S.decided[curDay]||{};
  const sections=[];
  const push=(title,cat,opts)=>{
    if(!opts||!opts.length)return;
    const rows=scoreRows(curDay,cat,opts);
    if(!rows.some(r=>r.total>0)){sections.push(`<div class="card"><h3>${title}</h3><p class="sub">No votes yet.</p></div>`);return;}
    const w=rows[0];
    const match=w.r1===1&&w.r2===1, agree=!match&&w.r1>0&&w.r2>0;
    let h=`<div class="card"><h3>${title}</h3>
      <p class="winnerline">Winner: <b>${esc(w.o.n)}</b> (${w.total} pts)
      ${match?'<span class="badge match">Perfect match</span>':agree?'<span class="badge agree">You agreed</span>':''}</p>
      <table class="res"><tr><th>Option</th><th>Diego</th><th>Juan Diego</th><th>Pts</th></tr>`;
    rows.forEach((r,i)=>{h+=`<tr class="${i===0?"win":""}"><td>${esc(r.o.n)}</td><td>${r.r1?"#"+r.r1:"—"}</td><td>${r.r2?"#"+r.r2:"—"}</td><td>${r.total}</td></tr>`;});
    h+=`</table></div>`;
    sections.push(h);
  };
  push("Places to visit","places",placesFor(curDay));
  push("Food","food",FOODS);
  const tk=tonightKind(curDay);
  if(tk==="nightopts")push("Tonight","tonight",nightOpts(curDay));
  else if(tk==="clubs"||tk==="locked_after")push("Tonight","tonight",clubOpts());
  if(curDay!=="d09"){push("Vibe of the day","vibe",VIBES);push("Sweet tooth showdown","dessert",DESSERTS);}
  const anyWin=sections.some(s=>s.indexOf("Winner:")>=0);
  box.innerHTML=sections.join("")+(anyWin&&!dec.places?`<button class="btn btn-gold" id="btnLock">Lock in this day's winners</button>`:"");
  const bl=$("btnLock"); if(bl)bl.onclick=lockDay;
}
function lockDay(){
  const cats={places:placesFor(curDay),food:FOODS,vibe:VIBES,dessert:DESSERTS};
  const tk=tonightKind(curDay);
  if(tk==="nightopts")cats.tonight=nightOpts(curDay);
  else if(tk==="clubs"||tk==="locked_after")cats.tonight=clubOpts();
  if(!S.decided[curDay])S.decided[curDay]={};
  Object.keys(cats).forEach(cat=>{
    const rows=scoreRows(curDay,cat,cats[cat]);
    if(rows.length&&rows[0].total>0)S.decided[curDay][cat]=rows[0].o.id;
  });
  showResults=false;syncHash();renderAll();
}
function renderAll(){renderIdentity();renderChips();renderDay();}
/* ================= SHARE / MODALS ================= */
function openSheet(html){$("sheet").innerHTML=html;$("modal").classList.add("open");}
function closeSheet(){$("modal").classList.remove("open");}
function shareURL(){syncHash();return location.href;}
function openShare(){
  const url=shareURL();
  openSheet(`<h3>Share our votes</h3>
  <p>Votes travel inside this link. Send it to Juan Diego — he opens it, sees your rankings, adds his, and taps See results. Always share the <b>newest</b> link so you stay in sync.</p>
  <div class="linkbox">${esc(url)}</div>
  <button class="btn btn-gold" id="btnCopy">Copy link</button>
  <a class="btn btn-blue" style="text-decoration:none;text-align:center;display:block" id="btnWA" href="https://wa.me/?text=${encodeURIComponent("Vote on our Boston trip days: "+url)}" target="_blank" rel="noopener">Send via WhatsApp</a>
  <button class="btn btn-ghost" onclick="closeSheet()">Close</button>`);
  $("btnCopy").onclick=()=>{
    const done=()=>{$("btnCopy").textContent="Copied!";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));}
    else fallbackCopy(url,done);
  };
}
function fallbackCopy(t,done){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}
function openHow(){
  openSheet(`<h3>How this works</h3>
  <div class="howto" style="border:none;padding:0;margin:0"><ol>
  <li>Tap <b>Voting as</b> up top and pick your name.</li>
  <li>Open a day and <b>rank your top 3</b> in each category — tap in order 1, 2, 3.</li>
  <li>Tap <b>Share our votes</b> and send the link to the other person.</li>
  <li>They open it, add their rankings, and tap <b>See results</b> — most points wins.</li>
  <li>Happy with it? Tap <b>Lock in this day's winners</b>. Picked places leave the pool for later days.</li>
  </ol>
  <p>Scoring: 1st = 3 pts, 2nd = 2 pts, 3rd = 1 pt per person. A <b>Perfect match</b> means you both ranked it #1.</p></div>
  <button class="btn btn-ghost" onclick="closeSheet()">Close</button>`);
}
window.closeSheet=closeSheet;
/* ================= INIT ================= */
$("btnDiego").onclick=()=>{S.me="diego";syncHash();renderAll();};
$("btnJD").onclick=()=>{S.me="juandiego";syncHash();renderAll();};
$("btnShare").onclick=openShare;
$("btnHow").onclick=openHow;
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet();});
loadState();
renderAll();
</script>
