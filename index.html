<title>Boston Trip Vote · Oct 25 – Nov 9</title>
<style>
:root{
  --navy:#0a1730; --navy2:#0d1f3d; --card:#132442; --line:#2a3f66;
  --gold:#d4af37; --blue:#4da3ff; --txt:#f2f5fa; --mut:#9fb0cc; --red:#e06c75;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--navy);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.45;}
header{position:sticky;top:0;z-index:20;background:var(--navy2);
  border-bottom:1px solid var(--line);padding:10px 14px;}
header h1{margin:0;font-size:18px;letter-spacing:.3px;}
header h1 .amp{color:var(--gold);}
header p{margin:2px 0 0;font-size:12.5px;color:var(--mut);}
.idrow{display:flex;gap:8px;margin-top:10px;align-items:center;}
.idrow span.lbl{font-size:12.5px;color:var(--mut);}
.idbtn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);
  border-radius:999px;padding:9px 0;font-size:14.5px;font-weight:600;cursor:pointer;}
.idbtn.on-diego{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;}
.idbtn.on-jd{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.idbtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.idstatic{font-size:14.5px;font-weight:600;}
.voterbar{background:#171208;border-bottom:1px solid var(--gold);padding:9px 14px;
  font-size:13px;color:var(--gold);position:sticky;top:0;z-index:20;}
#daybar{position:sticky;top:0;z-index:19;background:var(--navy);border-bottom:1px solid var(--line);}
#daychips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;}
#daychips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;min-width:66px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);border-radius:12px;padding:7px 6px;font-size:12px;text-align:center;cursor:pointer;}
.chip b{display:block;font-size:13.5px;}
.chip .st{display:block;height:8px;margin-top:4px;}
.chip .st i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 2px;background:#3a4f78;}
.chip .st i.one{background:var(--blue);}
.chip .st i.two{background:var(--blue);}
.chip .st i.lock{background:var(--gold);}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
main{max-width:660px;margin:0 auto;padding:6px 12px 120px;}
.dayhead{margin:14px 2px 4px;}
.dayhead h2{margin:0;font-size:21px;}
.dayhead p{margin:2px 0 0;color:var(--mut);font-size:13.5px;}
.dayhead .adminrow{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;}
.mini{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:9px;
  padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;}
.mini.danger{border-color:var(--red);color:var(--red);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 13px 11px;margin:12px 0;}
.card h3{margin:0 0 2px;font-size:15.5px;}
.card .sub{font-size:12.5px;color:var(--mut);margin:0 0 6px;}
.opt{position:relative;display:block;width:100%;text-align:left;background:#0f2038;
  border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:10px 12px;margin:8px 0;cursor:pointer;font-size:14.5px;}
.opt .nm{font-weight:600;}
.opt .bl{font-size:12.5px;color:var(--mut);margin-top:2px;}
.opt .go{font-size:12.5px;color:var(--blue);margin-top:4px;display:inline-block;}
.opt .rank{position:absolute;top:8px;right:10px;min-width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#1a1206;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;}
.opt.picked{border-color:var(--gold);}
.votes{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.vtag{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--mut);}
.vtag.d{border-color:var(--blue);color:var(--blue);}
.vtag.j{border-color:var(--gold);color:var(--gold);}
.locked{border:1px dashed var(--gold);border-radius:11px;padding:10px 12px;margin:8px 0;background:#171208;}
.locked .nm{font-weight:700;color:var(--gold);}
.locked .bl{font-size:12.5px;color:var(--mut);}
.notice{background:#101f3a;border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:13.5px;color:var(--mut);margin:12px 0;}
.notice b{color:var(--txt);}
select{width:100%;background:#0f2038;color:var(--txt);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:14.5px;margin-top:8px;}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;
  font-size:15.5px;font-weight:700;cursor:pointer;margin:10px 0;}
.btn-gold{background:var(--gold);color:#1a1206;}
.btn-blue{background:var(--blue);color:#06121f;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
table.res th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;
  text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);}
table.res td{padding:7px 4px;border-bottom:1px solid #1c2f52;vertical-align:top;}
table.res tr.win td{background:#1a1408;}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;
  padding:2px 8px;margin-left:6px;vertical-align:1px;}
.badge.match{background:var(--gold);color:#1a1206;}
.badge.agree{background:#274b7a;color:#cfe3ff;}
.winnerline{font-size:14.5px;margin:8px 0 2px;}
.winnerline b{color:var(--gold);}
#sharebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy2);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
#sharebar .row{max-width:660px;margin:0 auto;display:flex;gap:8px;}
#sharebar .btn{margin:0;}
#modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.78);display:none;
  align-items:flex-end;justify-content:center;}
#modal.open{display:flex;}
.sheet{background:var(--navy2);border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;max-width:660px;width:100%;padding:18px 16px 26px;
  max-height:86vh;overflow:auto;}
.sheet h3{margin:0 0 8px;}
.sheet p{font-size:13.5px;color:var(--mut);}
.linkbox{background:#0a1428;border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:12px;word-break:break-all;color:var(--blue);max-height:110px;overflow:auto;}
.howto{background:var(--card);border:1px solid var(--gold);border-radius:14px;
  padding:13px;margin:12px 0;font-size:13.5px;}
.howto b{color:var(--gold);}
.howto ol{margin:8px 0 4px;padding-left:20px;}
.howto li{margin:4px 0;}
.extbtn{display:inline-block;background:#1b3a6b;color:#fff;border-radius:9px;
  padding:8px 12px;font-size:13px;text-decoration:none;margin:6px 6px 0 0;}
a{color:var(--blue);}
</style>
</head>

 {n:"Eventbrite: Latin parties in Boston",u:"https://www.eventbrite.com/d/ma--boston/latin-party/"},

const VOTERS={diego:{n:"Diego",c:"#4da3ff"},juandiego:{n:"Juan Diego",c:"#d4af37"}};
const CATMAX={places:3,food:2,tonight:3,dessert:3};
const CATTITLES={places:"Places to visit",food:"Food",tonight:"Tonight",dessert:"Dessert"};
/* ================= STATE ================= */
function blankState(){return {me:"diego",votes:{diego:{},juandiego:{}},cuisine:{},decided:{}};}
let S=blankState();
let MODE="admin", VDAY=null, curDay="d25", showResults=false, loadedShared=false;
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function dec(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}
function parseHash(){
  const out={state:null,mode:"admin",day:null};
  location.hash.replace(/^#/,"").split("&").forEach(p=>{
    if(p.indexOf("s=")===0)out.state=dec(p.slice(2));
    else if(p.indexOf("mode=")===0)out.mode=p.slice(5);
    else if(p.indexOf("day=")===0)out.day=p.slice(4);
  });
  return out;
}
function saveLocal(){try{localStorage.setItem("btv2",enc(S));}catch(e){}}
function syncHash(){
  let h="#s="+enc(S);
  if(MODE==="voter"&&VDAY)h+="&mode=voter&day="+VDAY;
  try{history.replaceState(null,"",h);}catch(e){}
  saveLocal();
}
function loadState(){
  const p=parseHash();
  if(p.state&&p.state.votes){S=Object.assign(blankState(),p.state);loadedShared=true;}
  else{try{const l=localStorage.getItem("btv2");if(l){const d=dec(l);if(d&&d.votes)S=Object.assign(blankState(),d);}}catch(e){}}
  if(p.mode==="voter"&&p.day&&ORDER.indexOf(p.day)>=0){MODE="voter";VDAY=p.day;S.me="juandiego";curDay=p.day;}
}
/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function dayVotes(v,d,c){const x=S.votes[v]&&S.votes[v][d];return (x&&x[c])||[];}
function hasVotes(v,dayId){const x=S.votes[v]&&S.votes[v][dayId];return !!(x&&Object.keys(x).some(k=>x[k]&&x[k].length));}
function myVotes(d,c){return dayVotes(S.me,d,c);}
function rankOf(v,d,c,o){const a=dayVotes(v,d,c);const i=a.indexOf(o);return i>=0?i+1:0;}
function decidedBefore(dayId){
  const idx=ORDER.indexOf(dayId),out=new Set();
  ORDER.slice(0,idx).forEach(did=>{const w=S.decided[did];if(w&&w.places)out.add(w.places);});
  return out;
}
function placesFor(dayId){const g=decidedBefore(dayId);return PLACES.filter(p=>!g.has(p.id));}
function tonightOpts(dayId){
  let list=(TONIGHT[dayId]||[]).slice();
  if(CLUB_NIGHTS.indexOf(dayId)>=0)list=list.concat(CLUBS);
  return list;
}
function dessertFor(dayId){return DESSERT_DAYS.indexOf(dayId)>=0?DESSERTS:[];}
function catsFor(dayId){
  const c=["places","food"];
  if(tonightOpts(dayId).length)c.push("tonight");
  if(dessertFor(dayId).length)c.push("dessert");
  return c;
}
function catOpts(dayId,cat){
  if(cat==="places")return placesFor(dayId);
  if(cat==="food")return FOODS;
  if(cat==="tonight")return tonightOpts(dayId);
  if(cat==="dessert")return dessertFor(dayId);
  return [];
}
/* ================= RENDER ================= */
function renderTop(){
  if(MODE==="voter"){
    const d=DAYS.find(x=>x.id===VDAY);
    $("topbar").innerHTML=`<div class="voterbar">Voting as <b>Juan Diego</b> · ${esc(d.d)} — ${esc(d.label)}. Pick your tops, then send them to Diego.</div>`;
    $("daybar").style.display="none";
  }else{
    $("daybar").style.display="block";
    $("topbar").innerHTML=`<header>
      <h1>Boston Trip Vote <span class="amp">·</span> <span style="font-weight:400;font-size:14px;">Oct 25 – Nov 9</span></h1>
      <p>Diego &amp; Juan Diego · admin view — you see everything</p>
      <div class="idrow"><span class="lbl">Voting as:</span>
      <button class="idbtn" id="btnDiego"><span class="dot" style="background:#4da3ff"></span>Diego</button>
      <button class="idbtn" id="btnJD"><span class="dot" style="background:#d4af37"></span>Juan Diego</button></div>
    </header>`;
    $("btnDiego").className="idbtn"+(S.me==="diego"?" on-diego":"");
    $("btnJD").className="idbtn"+(S.me==="juandiego"?" on-jd":"");
    $("btnDiego").onclick=()=>{S.me="diego";showResults=false;syncHash();renderAll();};
    $("btnJD").onclick=()=>{S.me="juandiego";showResults=false;syncHash();renderAll();};

}
function dayStatus(dayId){
  if(S.decided[dayId]&&Object.keys(S.decided[dayId]).length)return "lock";
  const ha=hasVotes("diego",dayId),hb=hasVotes("juandiego",dayId);
  if(ha&&hb)return "two";if(ha||hb)return "one";return "";
}
function renderChips(){
  $("daychips").innerHTML=DAYS.map(d=>{
    const st=dayStatus(d.id);
    const dot=st==="lock"?'<i class="lock"></i>':st==="two"?'<i class="two"></i><i class="two"></i>':st==="one"?'<i class="one"></i>':"<i></i>";
    const p=d.d.split(" ");
    return `<button class="chip${d.id===curDay?" on":""}" data-day="${d.id}"><b>${p[0]}</b>${p[1]} ${p[2]}<span class="st">${dot}</span></button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{curDay=c.dataset.day;showResults=false;renderAll();window.scrollTo(0,0);});
}
function optHTML(dayId,cat,o){
  const max=CATMAX[cat],mine=myVotes(dayId,cat),ri=mine.indexOf(o.id);
  const r1=rankOf("diego",dayId,cat,o.id),r2=rankOf("juandiego",dayId,cat,o.id);
  let tags="";
  if(MODE==="admin"){
    if(r1)tags+=`<span class="vtag d">Diego #${r1}</span>`;
    if(r2)tags+=`<span class="vtag j">Juan Diego #${r2}</span>`;
  }else if(r2)tags+=`<span class="vtag j">Your pick #${r2}</span>`;
  const link=o.u?`<a class="go" href="${esc(o.u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open link</a>`:"";
  return `<button class="opt${ri>=0?" picked":""}" data-cat="${cat}" data-opt="${esc(o.id)}">
    ${ri>=0?`<span class="rank">${ri+1}</span>`:""}
    <span class="nm">${esc(o.n)}</span>${o.b?`<div class="bl">${esc(o.b)}</div>`:""}
    ${link}${tags?`<div class="votes">${tags}</div>`:""}</button>`;
}
function latinCard(){
  return `<div class="notice"><b>Tonight's Latin parties — live listings.</b><br>These pages always show what's actually on:<br>
  ${LATIN_LINKS.map(l=>`<a class="extbtn" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.n)}</a>`).join("")}</div>`;
}
function catCard(dayId,cat){
  const max=CATMAX[cat],opts=catOpts(dayId,cat),dec=S.decided[dayId]&&S.decided[dayId][cat];
  const subs={places:`Rank your top ${max}. Picked places leave the pool for later days.`,
    food:`Pick your top ${max}.`,tonight:`Rank your top ${max}. Tap again to remove.`,
    dessert:`Famous Boston dessert spots — rank your top ${max}.`};
  let h=`<div class="card"><h3>${CATTITLES[cat]}</h3><p class="sub">${subs[cat]}</p>`;
  if(dec){
    const o=opts.find(x=>x.id===dec);
    h+=`<div class="locked"><div class="nm">${esc(o?o.n:dec)}</div><div class="bl">Decided</div></div>`;
  }else h+=opts.map(o=>optHTML(dayId,cat,o)).join("");
  if(cat==="food"){
    const cur=S.cuisine[dayId]||"";
    h+=`<p class="sub" style="margin-top:10px">If "We go out to eat" wins — cuisine:</p>
    <select id="cuisineSel"><option value="">Pick a cuisine…</option>
    ${CUISINES.map(c=>`<option${c===cur?" selected":""}>${c}</option>`).join("")}</select>`;
  }
  if(cat==="tonight"&&CLUB_NIGHTS.indexOf(dayId)>=0)h+=latinCard();
  return h+`</div>`;
}
function renderDay(){
  const d=DAYS.find(x=>x.id===curDay);
  let h=`<div class="dayhead"><h2>${d.d}</h2><p>${esc(d.label)}</p>`;
  if(MODE==="admin"){
    h+=`<div class="adminrow">
      <button class="mini" id="btnVoterLink">Juan Diego's link for this day</button>
      <button class="mini danger" id="btnClearDay">Clear this day</button></div>`;
  }
  h+=`</div>`;
  if(MODE==="admin"&&loadedShared){h+=`<div class="notice"><b>Votes loaded from a shared link.</b> This is your admin view — you see both voters. Share the newest link to stay in sync.</div>`;loadedShared=false;}
  catsFor(curDay).forEach(c=>{h+=catCard(curDay,c);});
  if(MODE==="admin"){
    h+=`<button class="btn btn-blue" id="btnRes">${showResults?"Hide results":"See results"}</button><div id="resbox"></div>`;
  }
  $("main").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>vote(curDay,b.dataset.cat,b.dataset.opt));
  const cs=$("cuisineSel");if(cs)cs.onchange=()=>{S.cuisine[curDay]=cs.value;syncHash();};
  if(MODE==="admin"){
    $("btnRes").onclick=()=>{showResults=!showResults;renderDay();if(showResults)renderResults();};
    $("btnVoterLink").onclick=openVoterLink;
    $("btnClearDay").onclick=()=>{if(confirm("Clear all votes and decisions for "+d.d+"?")){clearDay(curDay);}};
    if(showResults)renderResults();
  }
}
function vote(dayId,cat,optId){
  const max=CATMAX[cat];
  if(!S.votes[S.me][dayId])S.votes[S.me][dayId]={};
  const arr=S.votes[S.me][dayId][cat]||(S.votes[S.me][dayId][cat]=[]);
  const i=arr.indexOf(optId);
  if(i>=0)arr.splice(i,1);else if(arr.length<max)arr.push(optId);
  syncHash();renderAll();
}
function scoreRows(dayId,cat,opts){
  const max=CATMAX[cat],p=r=>r?(max+1-r):0;
  return opts.map(o=>{
    const r1=rankOf("diego",dayId,cat,o.id),r2=rankOf("juandiego",dayId,cat,o.id);
    return {o,r1,r2,total:p(r1)+p(r2)};
  }).sort((a,b)=>b.total-a.total||(a.r1||9)-(b.r1||9));

function renderResults(){

      ${match?'<span class="badge match">Perfect match</span>':agree?'<span class="badge agree">You agreed</span>':''}</p>
      <table class="res"><tr><th>Option</th><th>Diego</th><th>Juan Diego</th><th>Pts</th></tr>`;
    rows.forEach((r,i)=>{h+=`<tr class="${i===0?"win":""}"><td>${esc(r.o.n)}${r.o.u?` <a href="${esc(r.o.u)}" target="_blank" rel="noopener">link</a>`:""}</td><td>${r.r1?"#"+r.r1:"—"}</td><td>${r.r2?"#"+r.r2:"—"}</td><td>${r.total}</td></tr>`;});
    sections.push(h+`</table></div>`);
  });
  const anyWin=sections.some(s=>s.indexOf("Winner:")>=0);
  const dec=S.decided[curDay]||{};
  box.innerHTML=sections.join("")+(anyWin&&!Object.keys(dec).length?`<button class="btn btn-gold" id="btnLock">Lock in this day's winners</button>`:"");
  const bl=$("btnLock");if(bl)bl.onclick=lockDay;
}
function lockDay(){
  if(!S.decided[curDay])S.decided[curDay]={};
  catsFor(curDay).forEach(cat=>{
    const rows=scoreRows(curDay,cat,catOpts(curDay,cat));
    if(rows.length&&rows[0].total>0)S.decided[curDay][cat]=rows[0].o.id;
  });
  showResults=false;syncHash();renderAll();
}
function clearDay(dayId){
  delete S.votes.diego[dayId];delete S.votes.juandiego[dayId];
  delete S.cuisine[dayId];delete S.decided[dayId];
  showResults=false;syncHash();renderAll();
}
function resetAll(){
  S=blankState();if(MODE==="voter")S.me="juandiego";
  try{localStorage.removeItem("btv2");}catch(e){}
  showResults=false;syncHash();renderAll();
}
function renderAll(){renderTop();if(MODE==="admin")renderChips();renderDay();renderSharebar();}
/* ================= SHARE ================= */
function openSheet(html){$("sheet").innerHTML=html;$("modal").classList.add("open");}
function closeSheet(){$("modal").classList.remove("open");}
window.closeSheet=closeSheet;
function baseURL(){return location.href.split("#")[0];}
function adminLink(){return baseURL()+"#s="+enc(S);}
function voterLink(dayId){return baseURL()+"#s="+enc(S)+"&mode=voter&day="+dayId;}
function copyText(t,btn){
  const done=()=>{btn.textContent="Copied!";};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);}
function linkSheet(title,desc,url,waText){
  openSheet(`<h3>${title}</h3><p>${desc}</p><div class="linkbox">${esc(url)}</div>
  <button class="btn btn-gold" id="btnCopy">Copy link</button>
  <a class="btn btn-blue" style="text-decoration:none;text-align:center;display:block" href="https://wa.me/?text=${encodeURIComponent(waText+" "+url)}" target="_blank" rel="noopener">Send via WhatsApp</a>
  <button class="btn btn-ghost" onclick="closeSheet()">Close</button>`);
  $("btnCopy").onclick=e=>copyText(url,e.target);
}
function openShare(){
  syncHash();
  linkSheet("Share our votes",
    "Your admin link — you see everything. Votes travel inside the link; always share the <b>newest</b> one.",
    adminLink(),"Our Boston trip votes (admin):");
}
function openVoterLink(){
  syncHash();
  const d=DAYS.find(x=>x.id===curDay);
  linkSheet("Juan Diego's link — "+d.d,
    "He sees <b>only this day</b>, votes as himself, and never sees your picks or the results. He taps <b>Send my votes to Diego</b> and you open his link back here.",
    voterLink(curDay),"Vote for "+d.d+" of our Boston trip:");
}
function openSendBack(){
  syncHash();
  linkSheet("Send my votes to Diego",
    "This link carries your votes for <b>"+esc(DAYS.find(x=>x.id===VDAY).d)+"</b>. Send it to Diego — he'll open it and see both sets of votes.",
    adminLink(),"My votes for our Boston trip:");
}
function openHow(){
  const admin=MODE==="admin";
  openSheet(`<h3>How this works</h3>
  <div class="howto" style="border:none;padding:0;margin:0"><ol>
  ${admin?`<li>Tap <b>Voting as</b> up top and pick your name.</li>
  <li>Open a day and rank your <b>top picks</b> in each category — tap in order.</li>
  <li>Tap <b>Juan Diego's link for this day</b> and send it to him — he only sees that day and only his own ballot.</li>
  <li>He taps <b>Send my votes to Diego</b>; you open his link and tap <b>See results</b> — most points wins.</li>
  <li>Happy? <b>Lock in this day's winners.</b> Picked places leave the pool for later days.</li>`
  :`<li>Rank your <b>top picks</b> in each category — tap in order 1, 2, 3.</li>
  <li>Tap <b>Send my votes to Diego</b> and send him the link.</li>
  <li>He'll show you the winners.</li>`}
  </ol>
  <p>Scoring: 1st = top points, then descending, per person. A <b>Perfect match</b> means you both ranked it #1.</p></div>
  ${admin?`<button class="btn btn-danger" id="btnResetAll">Reset everything (all days, all votes)</button>`:""}
  <button class="btn btn-ghost" onclick="closeSheet()">Close</button>`);
  if(admin)$("btnResetAll").onclick=()=>{if(confirm("Reset EVERYTHING? All votes and locked days will be cleared.")){resetAll();closeSheet();}};
}
function renderSharebar(){
  const r=$("shareRow");
  if(MODE==="voter"){
    r.innerHTML=`<button class="btn btn-ghost" id="btnHow" style="flex:0 0 44px;">?</button>
    <button class="btn btn-gold" id="btnSendBack">Send my votes to Diego</button>`;
    $("btnSendBack").onclick=openSendBack;
  }else{
    r.innerHTML=`<button class="btn btn-ghost" id="btnHow" style="flex:0 0 44px;">?</button>
    <button class="btn btn-gold" id="btnShare">Share our votes</button>`;
    $("btnShare").onclick=openShare;
  }
  $("btnHow").onclick=openHow;
}
/* ================= INIT ================= */
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet();});
loadState();
renderAll();
</script>
</body>
</html>
